name: Build Project
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Build App
        run: |
          $projFile = Get-ChildItem -Recurse -Filter *.vcxproj | Select-Object -First 1
          if ($projFile) {
              msbuild $projFile.FullName /p:Configuration=Release /p:Platform=x64
          } else {
              Write-Error "Ziadny .vcxproj subor sa nenasiel v repozitari!"
          }
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MojaHra
          path: |
            **/x64/Release/*.exe
            **/Release/*.exe
